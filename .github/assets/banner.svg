<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BANISH PROTOCOL">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0e1a24"/>
      <stop offset="55%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="12" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="12" fill="none" stroke="#122430" stroke-width="2"/>

  <!-- circuit traces -->
  <g stroke="#0d3a4a" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M40 60 H190 L230 100 H320"/>
    <path d="M40 260 H150 L190 220 H290 L320 250 H410"/>
    <path d="M1160 70 H1010 L970 110 H880"/>
    <path d="M1160 250 H1040 L1000 210 H910 L880 240 H790"/>
    <path d="M600 18 V44"/>
    <path d="M520 302 V276"/>
    <path d="M690 302 V270"/>
  </g>
  <g fill="#0d3a4a">
    <circle cx="320" cy="100" r="4"/>
    <circle cx="410" cy="250" r="4"/>
    <circle cx="880" cy="110" r="4"/>
    <circle cx="790" cy="240" r="4"/>
    <circle cx="600" cy="44" r="4"/>
    <circle cx="520" cy="276" r="4"/>
    <circle cx="690" cy="270" r="4"/>
  </g>
  <g fill="#1de9b6" opacity="0.85">
    <circle cx="230" cy="100" r="2.5"/>
    <circle cx="190" cy="220" r="2.5"/>
    <circle cx="970" cy="110" r="2.5"/>
    <circle cx="1000" cy="210" r="2.5"/>
  </g>

  <!-- glitch title: LIMBO large with ghost copies -->
  <g font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="98" letter-spacing="16" text-anchor="middle">
    <text x="596" y="150" fill="#ff2d78" opacity="0.5">BANISH</text>
    <text x="606" y="156" fill="#00e5ff" opacity="0.5">BANISH</text>
    <text x="601" y="153" fill="#e8f4ff">BANISH</text>
  </g>
  <!-- PROTOCOL beneath, wide-tracked -->
  <g font-family="'Courier New', Courier, monospace" font-weight="bold" font-size="42" letter-spacing="28" text-anchor="middle">
    <text x="598" y="211" fill="#ff2d78" opacity="0.45">PROTOCOL</text>
    <text x="605" y="214" fill="#00e5ff" opacity="0.45">PROTOCOL</text>
    <text x="601" y="212" fill="#9fdcff">PROTOCOL</text>
  </g>

  <!-- glitch slice bars through the title -->
  <rect x="360" y="112" width="480" height="6" fill="#03050a" opacity="0.85"/>
  <rect x="430" y="113" width="340" height="3" fill="#ff2d78" opacity="0.35"/>
  <rect x="330" y="136" width="540" height="3" fill="#03050a" opacity="0.7"/>
  <rect x="380" y="197" width="440" height="3" fill="#03050a" opacity="0.7"/>

  <!-- scanline wash -->
  <rect width="1200" height="320" rx="12" fill="url(#scan)"/>

  <g font-family="'Courier New', Courier, monospace" font-size="19" letter-spacing="6" text-anchor="middle">
    <text x="600" y="258" fill="#5f7f93">DESCEND · DECRYPT · EXFILTRATE</text>
  </g>
  <g font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="2" text-anchor="middle">
    <text x="600" y="292" fill="#2e4f63">[ nothing in her stays dead — MOTHER is listening ]</text>
  </g>
</svg>
